name: Link check

on:
  schedule:
    - cron: "17 2 * * 1" # every Monday 02:17 UTC (09:17 WIB)
  workflow_dispatch:
  pull_request:
    paths:
      - "**.md"
      - "scripts/check_links.py"
  push:
    branches: [main]
    paths:
      - "**.md"
      - "scripts/check_links.py"

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links
        env:
          # Built-in, short-lived token from GitHub Actions; used only for read-only GitHub API calls. No custom secrets.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_links.py $(git ls-files '*.md')
      - name: Open an issue when the weekly run finds dead links
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Link check failed ($(date -u +%Y-%m-%d))" \
            --body "The weekly link check found dead links. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
